name: DSH Root APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a testing prerelease after basic checks
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dsh-root-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-checks:
    name: Basic refusal and source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 dsh-mobile/tools/verify-root-release.py
      - run: python3 -m unittest discover -s dsh-mobile/tools -p 'test_apk_runtime.py' -v
      - run: bash native/mobile-supervisor/test-host.sh
      - run: python3 -m unittest discover -s dsh-mobile/runtime -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - run: node --test dsh-mobile/tools/workspace-ops.test.mjs

  runtime:
    name: ARM64 prebuilt runtime
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        id: runtime-cache
        with:
          path: dsh-mobile/runtime/out
          key: root-arm64-runtime-v1-${{ hashFiles('dsh-mobile/runtime/**', 'packages/bundle/base/cordis.patch.yml', 'packages/bundle/web-app/cordis.patch.yml') }}
      - name: Build Linux userspace and run keyless smoke checks
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: sudo --preserve-env=GITHUB_SHA bash dsh-mobile/runtime/build-runtime.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-runtime
          path: |
            dsh-mobile/runtime/out/runtime.tar.gz
            dsh-mobile/runtime/out/runtime-manifest.json
            dsh-mobile/runtime/out/*.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-corresponding-sources
          path: |
            dsh-mobile/runtime/out/runtime-sources.tar.gz
            dsh-mobile/runtime/out/runtime-sources-sha256.txt
            dsh-mobile/runtime/out/incomplete-source-downloads.txt
          if-no-files-found: error
          retention-days: 14

  apk:
    name: Android ARM64 testing APK
    needs: [runtime, source-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: arm64-runtime
          path: dsh-mobile/app/src/main/assets/runtime
      - name: Preserve gzip bytes through Android asset merging
        run: mv dsh-mobile/app/src/main/assets/runtime/runtime.tar.gz dsh-mobile/app/src/main/assets/runtime/runtime.payload
      - name: Build Android PIE supervisor and stage the executable as an extracted native library
        run: |
          cmake -S native/mobile-supervisor -B "$RUNNER_TEMP/supervisor-build" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/supervisor-build" --parallel 2
          readelf -lW "$RUNNER_TEMP/supervisor-build/libmobile_supervisor.so" > "$RUNNER_TEMP/supervisor-elf.txt"
          python3 - "$RUNNER_TEMP/supervisor-elf.txt" <<'PY'
          import pathlib, sys
          loads = [line.split() for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.strip().startswith('LOAD ')]
          assert loads and all(int(row[-1], 16) >= 16384 for row in loads), 'Supervisor ELF must support 16 KiB alignment'
          PY
          mkdir -p dsh-mobile/app/src/main/jniLibs/arm64-v8a
          cp "$RUNNER_TEMP/supervisor-build/libmobile_supervisor.so" dsh-mobile/app/src/main/jniLibs/arm64-v8a/
      - name: Basic source and runtime checks
        run: |
          python3 dsh-mobile/tools/verify-root-release.py
          cd dsh-mobile/app/src/main/assets/runtime
          python3 - <<'PY'
          import hashlib, json, pathlib
          p = pathlib.Path('runtime.payload')
          manifest = json.loads(pathlib.Path('runtime-manifest.json').read_text())
          assert hashlib.file_digest(p.open('rb'), 'sha256').hexdigest() == manifest['sha256']
          PY
      - name: Assemble testing APK
        working-directory: dsh-mobile
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify packaging and collect evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p dist
          cp dsh-mobile/app/build/outputs/apk/debug/app-debug.apk dist/DSH-Root-arm64-test.apk
          python3 dsh-mobile/tools/verify-apk-runtime.py dist/DSH-Root-arm64-test.apk \
            --manifest dsh-mobile/app/src/main/assets/runtime/runtime-manifest.json > dist/runtime-asset-check.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 dist/DSH-Root-arm64-test.apk > dist/zipalign.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/DSH-Root-arm64-test.apk > dist/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/DSH-Root-arm64-test.apk > dist/apk-info.txt
          cp dsh-mobile/app/src/main/assets/runtime/runtime-manifest.json dist/
          cp "$RUNNER_TEMP/supervisor-elf.txt" dist/
          cp dsh-mobile/IMPLEMENTATION.md dist/
          cp dsh-mobile/ROOT-TESTING.md dist/TESTING.md
          printf 'source=%s\nrun=%s\n' "$SOURCE_SHA" "$RUN_URL" > dist/build.txt
          cd dist && sha256sum DSH-Root-arm64-test.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Root-arm64-testing-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish testing download
    if: inputs.publish
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DSH-Root-arm64-testing-apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: runtime-corresponding-sources
          path: dist
      - name: Publish prerelease with explicit testing limits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          tag="root-alpha-${RUN_NUMBER}"
          (cd dist && sha256sum runtime-sources.tar.gz > runtime-sources-sha256.txt)
          gh release create "$tag" dist/* --target "$SOURCE_SHA" --prerelease \
            --title "DSH Root testing alpha ${RUN_NUMBER}" --notes-file dist/TESTING.md
